<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 群聊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='10' r='8' fill='%23c9643c'/%3E%3Ccircle cx='9' cy='21' r='8' fill='%233d7bea' fill-opacity='.9'/%3E%3Ccircle cx='23' cy='21' r='8' fill='%2312956f' fill-opacity='.9'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" class="app">

  <!-- 左侧：群列表 + 成员 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></div>
      <div>
        <div class="brand-name">AI 群聊</div>
        <div class="brand-sub">Claude · Gemini · GPT 同群协作</div>
      </div>
    </div>

    <button class="btn-new" id="btnNewRoom" type="button"><span aria-hidden="true">＋</span> 新建群聊</button>

    <div class="side-label">群聊</div>
    <nav class="rooms" id="rooms" aria-label="群聊列表"></nav>

    <div class="side-label">成员 <button class="side-link" id="btnWizard" type="button" hidden>连接向导</button></div>
    <div class="members" id="members"></div>

    <button class="side-foot" id="btnSettings" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm7.4-3.2c0-.5 0-1-.1-1.4l2-1.5-2-3.4-2.3.9c-.7-.6-1.5-1-2.4-1.4L14.2 2h-4l-.4 2.6c-.9.3-1.7.8-2.4 1.4l-2.3-.9-2 3.4 2 1.5a8 8 0 0 0 0 2.8l-2 1.5 2 3.4 2.3-.9c.7.6 1.5 1 2.4 1.4l.4 2.6h4l.4-2.6c.9-.3 1.7-.8 2.4-1.4l2.3.9 2-3.4-2-1.5c.1-.4.1-.9.1-1.4Z"/></svg>
      设置与分工
    </button>
  </aside>

  <!-- 右侧：聊天区 -->
  <main class="chat" id="chat">
    <header class="chat-head">
      <button class="icon-btn only-narrow" id="btnMenu" type="button" aria-label="打开群聊列表">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="chat-title-wrap">
        <button class="chat-title" id="roomTitle" type="button" title="点击改名"></button>
        <div class="chat-sub" id="roomSub"></div>
      </div>
      <div class="head-actions">
        <div class="seg" id="modeSeg" role="group" aria-label="权限模式">
          <button type="button" data-mode="discuss" title="三位成员都只读：只讨论，不改任何文件">讨论</button>
          <button type="button" data-mode="work" title="允许 Claude 和 GPT 在工作目录里创建、修改文件">动手</button>
        </div>
        <button class="icon-btn" id="btnDeleteRoom" type="button" aria-label="删除这个群" title="删除这个群">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        </button>
      </div>
    </header>

    <div class="banner" id="banner" hidden role="status"></div>
    <div class="flowbar" id="flowbar" hidden></div>

    <section class="stream" id="stream" aria-live="polite">
      <div class="stream-inner" id="messages"></div>
      <div class="stream-inner" id="typing"></div>
    </section>
    <button class="jump" id="btnJump" type="button" hidden>↓ 有新消息</button>

    <footer class="composer">
      <div class="composer-inner">
        <div class="chips" id="chips" role="group" aria-label="固定流程"></div>
        <div class="flow-hint" id="flowHint" hidden></div>
        <div class="input-row">
          <div class="mention-pop" id="mentionPop" hidden role="listbox"></div>
          <textarea id="input" rows="1" aria-label="发消息" autocomplete="off" spellcheck="false"></textarea>
          <button class="btn-send" id="btnSend" type="button">发送</button>
          <button class="btn-stop" id="btnStop" type="button" hidden>停止</button>
        </div>
        <div class="composer-foot" id="composerFoot"></div>
      </div>
    </footer>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="/md.js"></script>
<script src="/app.js"></script>
</body>
</html>
